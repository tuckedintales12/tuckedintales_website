<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track your order — TuckedIn Tales</title>
<meta name="description" content="Check where your TuckedIn Tales storybook is.">
<link rel="icon" href="images/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#172c59;--cream:#fff7e8;--ink:#26324a;--gold:#f5b83d;--coral:#ff78ac;--teal:#4aa5cf;--line:rgba(23,44,89,.18)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(150deg,#eaf8ff 0%,#f3edff 45%,#fff7e8 100%) fixed;color:var(--navy);font-family:"Quicksand",sans-serif;font-size:17px;line-height:1.6}
h1,h2,h3{font-family:"Baloo 2",sans-serif;margin:0}
a{color:inherit}
nav{background:#fff;border-bottom:3px solid var(--navy)}
.navin{max-width:960px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;font-family:"Baloo 2";font-weight:800;font-size:1.2rem;text-decoration:none}
.brand img{width:38px;height:38px}
.back{font-size:.88rem;font-weight:700;text-decoration:none;opacity:.75}
.wrap{max-width:560px;margin:0 auto;padding:36px 20px 70px}
.head{text-align:center;margin-bottom:22px}
.head h1{font-size:clamp(1.6rem,5vw,2.1rem)}
.head p{margin:8px 0 0;opacity:.75;font-weight:600}
.card{background:#fff;border:3px solid var(--navy);border-radius:22px;padding:22px;box-shadow:0 8px 0 rgba(23,44,89,.13)}
label{display:block;font-weight:700;font-size:.85rem;margin:14px 0 6px}
label:first-of-type{margin-top:0}
input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:2.5px solid var(--navy);border-radius:14px;background:#fff;color:var(--navy)}
input:focus{outline:3px solid rgba(245,184,61,.6)}
.hint{font-size:.78rem;opacity:.65;margin-top:5px}
button.go{margin-top:18px;width:100%;font:inherit;font-weight:800;font-size:1rem;padding:13px;border-radius:999px;border:3px solid var(--navy);background:var(--gold);color:var(--navy);cursor:pointer}
button.go:disabled{opacity:.6;cursor:wait}
.err{display:none;margin-top:14px;background:#fdecef;border:2px solid #e8527f;color:#8a1f3d;border-radius:12px;padding:10px 14px;font-weight:600;font-size:.9rem}
#result{display:none;margin-top:22px}
.books{margin:0 0 14px;padding:0;list-style:none}
.books li{background:#eaf6ff;border-radius:12px;padding:8px 12px;margin-bottom:6px;font-weight:600;font-size:.92rem}
.meta{font-size:.85rem;opacity:.7;margin:0 0 16px}
.steps{list-style:none;margin:0;padding:0}
.steps li{position:relative;padding:0 0 22px 46px;font-weight:600}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:3px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps li.done::before{background:var(--teal)}
.dot{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;border:3px solid var(--navy);background:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800;color:rgba(23,44,89,.45)}
.steps li.done .dot{background:var(--teal);color:#fff}
.steps li.now .dot{background:var(--coral);color:#fff;box-shadow:0 0 0 5px rgba(255,120,172,.28)}
.steps small{display:block;font-weight:600;opacity:.65;font-size:.8rem}
.steps li:not(.done):not(.now){opacity:.55}
.ship{margin-top:18px;background:#fff7e8;border:2.5px dashed var(--navy);border-radius:14px;padding:12px 14px;font-size:.92rem;display:none}
.ship a{font-weight:800;text-decoration:underline}
.cancelled{background:#fdecef;border:2px solid #e8527f;border-radius:12px;padding:12px 14px;font-weight:700;color:#8a1f3d;display:none}
.help{text-align:center;font-size:.85rem;opacity:.75;margin-top:22px}
</style>
</head>
<body>
<nav><div class="navin"><a class="brand" href="index.html"><img src="images/logo-mark.png" alt="TuckedIn Tales">TuckedIn Tales</a><a class="back" href="index.html">← Home</a></div></nav>
<div class="wrap">
  <div class="head"><h1>Track your order 📦</h1><p>See which stage your storybook is at.</p></div>
  <div class="card">
    <form id="trackForm" novalidate>
      <label for="ref">Order number</label>
      <input id="ref" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="order_XXXXXXXXXXXXXX">
      <div class="hint">It's in your confirmation email and on the thank-you screen.</div>
      <label for="phone">Phone number on the order</label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="e.g. 9876543210">
      <button class="go" id="goBtn" type="submit">Track my book</button>
      <div class="err" id="err" role="alert"></div>
    </form>

    <div id="result" aria-live="polite">
      <div class="cancelled" id="cancelledBox">This order was cancelled. If you didn't expect this, please email us.</div>
      <h2 id="statusTitle" style="font-size:1.3rem;margin-bottom:6px"></h2>
      <ul class="books" id="books"></ul>
      <p class="meta" id="meta"></p>
      <ol class="steps" id="steps"></ol>
      <div class="ship" id="shipBox"></div>
    </div>
  </div>
  <p class="help">Need help? Email <a href="mailto:tuckedintales.12@gmail.com">tuckedintales.12@gmail.com</a></p>
</div>
<script>
(function(){
  var SUPABASE_URL = 'https://ywwugahadsuwgyzceisa.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_u-KZP2jDGhFy_oA1uQPDKQ_HtSD4B8v';
  var STAGES = [
    ['paid','Order received','We have your photo, details and payment.'],
    ['illustrating','Illustrating','Your book is being illustrated.'],
    ['printing','Printing','Your book is at the printer.'],
    ['shipped','Shipped','On its way to you.'],
    ['delivered','Delivered','Enjoy the story!']
  ];
  var $ = function(id){ return document.getElementById(id); };
  function fmt(d){ try { return new Date(d).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); } catch(e){ return ''; } }
  function showErr(m){ var e=$('err'); e.textContent=m; e.style.display = m ? 'block' : 'none'; }

  function render(r){
    $('result').style.display = 'block';
    var cancelled = r.status === 'cancelled';
    $('cancelledBox').style.display = cancelled ? 'block' : 'none';
    var idx = STAGES.findIndex(function(s){ return s[0] === r.status; });
    if (idx < 0) idx = 0;
    $('statusTitle').textContent = cancelled ? 'Order cancelled' : (STAGES[idx][1] === 'Order received' ? 'We have your order 🎉' : STAGES[idx][1] + ' ' + (r.status==='delivered'?'💛':r.status==='shipped'?'🚚':r.status==='printing'?'🖨️':'✏️'));
    var books = $('books'); books.textContent = '';
    (r.books || []).forEach(function(b){
      var li = document.createElement('li');
      li.textContent = '📖 ' + (b.child || 'Your child') + ' — ' + (b.story || '');
      books.appendChild(li);
    });
    $('meta').textContent = 'Ordered ' + fmt(r.ordered_on) + (r.updated_on ? ' · Last update ' + fmt(r.updated_on) : '') + (r.book_size ? ' · ' + r.book_size : '');
    var ol = $('steps'); ol.textContent = '';
    if (!cancelled) {
      STAGES.forEach(function(s, i){
        var li = document.createElement('li');
        li.className = i < idx ? 'done' : (i === idx ? 'now' : '');
        var dot = document.createElement('span'); dot.className = 'dot'; dot.textContent = i < idx ? '✓' : String(i+1);
        li.appendChild(dot);
        li.appendChild(document.createTextNode(s[1]));
        var sm = document.createElement('small'); sm.textContent = s[2]; li.appendChild(sm);
        ol.appendChild(li);
      });
    }
    var box = $('shipBox'); box.textContent = ''; box.style.display = 'none';
    if (r.tracking_number || r.tracking_url) {
      box.style.display = 'block';
      var b1 = document.createElement('b'); b1.textContent = 'Courier: '; box.appendChild(b1);
      box.appendChild(document.createTextNode((r.courier || '—') + ' '));
      box.appendChild(document.createElement('br'));
      var b2 = document.createElement('b'); b2.textContent = 'Tracking number: '; box.appendChild(b2);
      box.appendChild(document.createTextNode(r.tracking_number || '—'));
      if (r.tracking_url && /^https?:\/\//i.test(r.tracking_url)) {
        box.appendChild(document.createElement('br'));
        var a = document.createElement('a'); a.href = r.tracking_url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = 'Track the parcel →';
        box.appendChild(a);
      }
    }
    $('result').scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  async function lookup(){
    showErr(''); $('result').style.display = 'none';
    var ref = $('ref').value.trim(), phone = $('phone').value.trim();
    if (ref.length < 8) return showErr('Please enter your order number (it starts with order_).');
    if (phone.replace(/\D/g,'').length < 4) return showErr('Please enter the phone number you used when ordering.');
    var btn = $('goBtn'); btn.disabled = true; btn.textContent = 'Looking…';
    try {
      var res = await fetch(SUPABASE_URL + '/rest/v1/rpc/track_order', {
        method: 'POST',
        headers: { 'Content-Type':'application/json', apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY },
        body: JSON.stringify({ p_ref: ref, p_phone: phone })
      });
      if (!res.ok) throw new Error('bad status');
      var data = await res.json();
      if (!data || !data.found) showErr("We couldn't find an order with those details. Please check the order number and phone number. (Orders appear here once payment is complete.)");
      else render(data);
    } catch (e) {
      showErr('Something went wrong while checking. Please try again in a moment.');
    } finally {
      btn.disabled = false; btn.textContent = 'Track my book';
    }
  }

  $('trackForm').addEventListener('submit', function(e){ e.preventDefault(); lookup(); });
  var o = new URLSearchParams(location.search).get('o');
  if (o) { $('ref').value = o.slice(0, 60); $('phone').focus(); }
})();
</script>
</body>
</html>
